events {}
http {
  # Host TLS proxy supplies https; direct HTTP requests keep their own scheme.
  map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
  }
  limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
  upstream web { server web:3000; }
  upstream api { server api:3000; }
  server {
    listen 80;
    client_max_body_size 25m;
    location /api/ {
      limit_req zone=api_rate burst=40 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $origin_scheme;
    }
    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $origin_scheme;
    }
  }
}
