services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: furniture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d furniture"]
      interval: 10s
      timeout: 3s
      retries: 10
  web: &app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: furniture-platform:dev
    command: [web]
    environment: &appenv
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      OPENAI_API_KEY_FILE: /run/secrets/openai_key
      SESSION_SECRET_FILE: /run/secrets/session_secret
      DATA_DIR: /data
    secrets: &appsecrets [postgres_password, openai_key, session_secret]
    volumes: [data:/data]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: &apphealth
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
  api:
    <<: *app
    command: [api]
  worker:
    <<: *app
    command: [worker]
    healthcheck:
      test: [CMD-SHELL, "ps | grep '[s]cripts/worker.ts' >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 3
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
secrets:
  postgres_password: { file: ./secrets/postgres_password }
  openai_key: { file: ./secrets/openai_key }
  session_secret: { file: ./secrets/session_secret }
volumes:
  pgdata:
  data:
