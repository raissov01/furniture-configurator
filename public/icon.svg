<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AisMebel">
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#1F2A37"/>
  <!-- шкаф корпусы -->
  <rect x="14" y="14" width="36" height="36" rx="2" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <!-- есіктер арасындағы саңылау -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#FFFFFF" stroke-width="3"/>
  <!-- тұтқалар -->
  <line x1="27" y1="27" x2="27" y2="35" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="37" y1="27" x2="37" y2="35" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- «i» нүктесі / ИИ белгісі -->
  <rect x="44" y="8" width="12" height="12" rx="2" fill="#E0A04A"/>
</svg>
